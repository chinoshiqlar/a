    return section(labels.gallery, body || empty());
  }
})();
</script>

<script id="chin-birthday-photo-fix-and-nav-declutter">
(function(){
  // ---------- 1) Пастдаги "Аъзо бўлиш"/"Аъзо кириши" тугмаларини яшириш ----------
  // Улар пастки навигация панелини ёпиб, халақит берарди — эндиликда шу тугмалар
  // юқоридаги ☰ менюси (drawer) ичига кўчирилди.
  const st = document.createElement('style');
  st.textContent = '#memberRegBtn,#chinMemberLogin,#chinMemberProfileBtn{display:none!important}';
  document.head.appendChild(st);

  function mirrorAuthButtons(){
    const p = document.getElementById('chinMemberProfileBtn');
    const dl = document.getElementById('drawerMemberLogin');
    const dp = document.getElementById('drawerMemberProfile');
    if (!p || !dl || !dp) return;
    const loggedIn = p.style.display === 'block';
    dl.style.display = loggedIn ? 'none' : 'block';
    dp.style.display = loggedIn ? 'block' : 'none';
  }
  document.addEventListener('DOMContentLoaded', function(){
    mirrorAuthButtons();
    const target = document.getElementById('chinMemberProfileBtn');
    if (target) new MutationObserver(mirrorAuthButtons).observe(target, { attributes: true, attributeFilter: ['style'] });
  });

  // ---------- 2) Туғилган кун расмини қабул қилмаслик муаммосини тузатиш ----------
  // Айрим телефонлар (масалан iPhone HEIC формати) расмни canvas орқали сиқишда
  // хатоликка учрайди — бунда энди расм сиқилмасдан, ўзининг ҳолида сақланади.
  window.compressMemberImage = function(file, done){
    const r = new FileReader();
    r.onload = () => {
      const dataUrl = r.result;
      const im = new Image();
      im.onload = () => {
        try {
          const max = 900;
          let w = im.width, h = im.height;
          if (w > max || h > max) { const k = Math.min(max / w, max / h); w = Math.round(w * k); h = Math.round(h * k); }
          const c = document.createElement('canvas');
          c.width = w; c.height = h;
          const ctx = c.getContext('2d');
          ctx.drawImage(im, 0, 0, w, h);
          done(c.toDataURL('image/jpeg', 0.82));
        } catch (e) {
          done(dataUrl);
        }
      };
      im.onerror = () => done(dataUrl);
      im.src = dataUrl;
    };
    r.onerror = () => done(null);
    r.readAsDataURL(file);
  };
})();
</script>

<script id="chin-section-access-control">
(function(){
  const SECTION_TYPES = ['news','songs','concerts','forum','members','gallery','videos','birthdays','notices'];

  function ac(){
    if (!db.settings) db.settings = {};
    if (!db.settings.accessControl) db.settings.accessControl = {};
    return db.settings.accessControl;
  }
  function isRestricted(p){ return !!ac()[p]; }
  function isLoggedIn(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      return !!(s && (s.access_token || s.user));
    }catch(e){ return false; }
  }

  // ---------- Админ: ҳар бўлим учун очиқ/ёпиқ тугмаси ----------
  const _prevShowAdmin = window.showAdmin;
  window.showAdmin = function(){
    _prevShowAdmin();
    const box = document.getElementById('modalbox');
    if (!box) return;
    const nav = box.querySelector('.adminnav');
    if (!nav || document.getElementById('accessAdminBtn')) return;
    const btn = document.createElement('button');
    btn.id = 'accessAdminBtn';
    btn.textContent = '🔒 Кириш ҳуқуқлари';
    btn.onclick = renderAccessAdmin;
    nav.appendChild(btn);
  };

  function renderAccessAdmin(){
    const rows = SECTION_TYPES.map(t=>`<label class="checkrow" style="justify-content:space-between;border-bottom:1px solid #321416;padding:10px 0"><span>${icons[t]} ${labels[t]}</span><input type="checkbox" data-access-type="${t}" ${isRestricted(t)?'checked':''} onchange="toggleSectionAccess('${t}',this.checked)"></label>`).join('');
    const regRow = `<label class="checkrow" style="justify-content:space-between;border-bottom:1px solid #321416;padding:10px 0"><span>👥 Аъзо бўлиш (рўйхатдан ўтиш)</span><input type="checkbox" ${isRegClosed()?'checked':''} onchange="toggleRegClosed(this.checked)"></label>`;
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>🔒 Кириш ҳуқуқлари</h2><p class="small">Белгиланган бўлимни фақат тизимга кирган (рўйхатдан ўтган) аъзолар кўра олади. Белгиланмаган бўлим ҳамма учун очиқ.</p><div class="form">${rows}${regRow}</div>`);
  }

  function isRegClosed(){ return !!ac().registrationClosed; }
  window.toggleRegClosed = function(checked){
    ac().registrationClosed = !!checked;
    save();
  };

  const _prevOpenMemberReg = window.openMemberReg;
  window.openMemberReg = function(){
    if (isRegClosed()) {
      alert('Ҳозирда янги аъзоларни рўйхатга олиш вақтинча тўхтатилган.');
      return;
    }
    _prevOpenMemberReg();
  };

  window.toggleSectionAccess = function(t, checked){
    ac()[t] = !!checked;
    save();
  };

  // ---------- Контентни чекловга кўра кўрсатиш ----------
  const _prevContent = window.content;
  window.content = function(p){
    if (isRestricted(p) && !isLoggedIn()) {
      return `<section class="section"><button class="back" onclick="go('home')">← Бош саҳифа</button><div class="sectionhead"><h2>${labels[p]}</h2></div><div class="empty" style="text-align:center;padding:30px 16px">
        <div style="font-size:34px;margin-bottom:8px">🔒</div>
        <p style="margin:0 0 14px">Бу бўлим фақат аъзоларимиз учун очиқ.<br>Давом этиш учун тизимга киринг ёки аъзо бўлинг.</p>
        <button type="button" class="btn" onclick="chinOpenLogin()">🔐 Аъзо кириши</button>
        <button type="button" class="btn dark" style="margin-left:8px" onclick="openMemberReg()">👥 Аъзо бўлиш</button>
      </div></section>`;
    }
    return _prevContent(p);
  };
})();
</script>

<script id="chin-personal-theme">
(function(){
  const KEY = 'chin_member_theme';
  const THEMES = ['gold','blue','redgold','green','black','purple'];

  function currentPersonalTheme(){
    const t = localStorage.getItem(KEY) || '';
    return THEMES.includes(t) ? t : '';
  }

  // Админ танлаган глобал дизайндан кейин, агар аъзо шахсий дизайн танлаган бўлса, уни устидан қўллаймиз
  const _prevApplyTheme = window.applyTheme;
  window.applyTheme = function(){
    _prevApplyTheme();
    const pt = currentPersonalTheme();
    if (!pt) return;
    THEMES.forEach(t => document.documentElement.classList.toggle('theme-'+t, t === pt));
  };

  window.chinSetPersonalTheme = function(value){
    if (value && THEMES.includes(value)) {
      localStorage.setItem(KEY, value);
    } else {
      localStorage.removeItem(KEY);
    }
    applyTheme();
  };

  document.addEventListener('DOMContentLoaded', function(){
    if (currentPersonalTheme()) applyTheme();
  });
})();
</script>

<script id="chin-mega-features">
(function(){
  // ================= 0. Ёрдамчи: гость токен ва аутентификация =================
  function guestToken(){
    let t = localStorage.getItem('chin_guest_token');
    if (!t) { t = 'g_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); localStorage.setItem('chin_guest_token', t); }
    return t;
  }
  function currentIdentity(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      const u = s && (s.user||s);
      if (u && u.email) return 'u_'+u.email;
    }catch(e){}
    return guestToken();
  }
  function isLoggedInM(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      return !!(s && (s.access_token || s.user));
    }catch(e){ return false; }
  }
  function currentMemberName(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      const u = s && (s.user||s);
      const meta = (u && u.user_metadata) || {};
      return meta.name || meta.full_name || '';
    }catch(e){ return ''; }
  }

  // ================= 1. Ёмон сўзлар фильтри =================
  const BAD_WORDS = ['блять','сука','похуй','ебал','пидор','хуй','пизда','гандон','шлюха'];
  function containsBadWords(text){
    const t = (text||'').toLowerCase();
    return BAD_WORDS.some(w => t.includes(w));
  }

  // ================= 2. Реакция (лайк) — Янгиликлар ва Қўшиқлар =================
  function likedSet(){
    try{ return new Set(JSON.parse(localStorage.getItem('chin_liked')||'[]')); }catch(e){ return new Set(); }
  }
  window.toggleLike = function(type, id){
    if (!db.reactions) db.reactions = {};
    const key = type+'_'+id;
    const set = likedSet();
    if (set.has(key)) {
      db.reactions[key] = Math.max(0, (db.reactions[key]||1) - 1);
      set.delete(key);
    } else {
      db.reactions[key] = (db.reactions[key]||0) + 1;
      set.add(key);
    }
    localStorage.setItem('chin_liked', JSON.stringify(Array.from(set)));
    save();
    render();
  };
  function likeBtn(type, id){
    const key = type+'_'+id;
    const count = (db.reactions && db.reactions[key]) || 0;
    const liked = likedSet().has(key);
    return `<button type="button" class="btn dark" style="margin-top:8px" onclick="toggleLike('${type}',${id})">${liked?'❤️':'🤍'} ${count}</button>`;
  }

  // ================= 3. Форум: эгалик асосида таҳрирлаш/ўчириш =================
  function forumTopicCardV2(f){
    const replies = f.replies || [];
    const mine = f.ownerToken === currentIdentity();
    const nm = currentMemberName();
    return `<article class="card">
      <h3>💬 ${esc(f.title)}</h3>
      <p>${esc(f.text)}</p>
      <span class="pill">${esc(f.author)} • ${replies.length} жавоб</span>
      ${replies.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #3a1a1a">${replies.map(r=>`<p style="margin:6px 0;font-size:13px"><b style="color:#f7d56b">${esc(r.author)}:</b> ${esc(r.text)}</p>`).join('')}</div>`:''}
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">
        <button type="button" class="btn" onclick="toggleReplyFormV2(${f.id})">💬 Жавоб ёзиш</button>
        ${mine?`<button type="button" class="btn dark" onclick="startEditForumTopic(${f.id})">✏ Таҳрир</button><button type="button" class="btn red" onclick="delForumTopic(${f.id})">🗑 Ўчириш</button>`:''}
      </div>
      <div id="editForm-${f.id}" class="form" style="display:none;margin-top:10px">
        <input id="editTitle-${f.id}" value="${esc(f.title)}">
        <textarea id="editText-${f.id}">${esc(f.text)}</textarea>
        <button type="button" class="btn" onclick="saveEditForumTopic(${f.id})">Сақлаш</button>
      </div>
      <div id="replyForm-${f.id}" class="form" style="display:none;margin-top:10px">
        ${nm?'':`<input id="replyAuthor-${f.id}" placeholder="Исмингиз">`}
        <textarea id="replyText-${f.id}" placeholder="Жавобингизни ёзинг..."></textarea>
        <button type="button" class="btn" onclick="submitForumReplyV2(${f.id})">Юбориш</button>
      </div>
    </article>`;
  }

  function forumSectionV2(){
    const nm = currentMemberName();
    const formHtml = `<div class="form" style="margin-bottom:14px">
      <h3 style="margin:0;color:#f7d56b">✍ Янги мавзу очиш</h3>
      ${nm?'':'<input id="newForumAuthor" placeholder="Исмингиз">'}
      <input id="newForumTitle" placeholder="Мавзу сарлавҳаси">
      <textarea id="newForumText" placeholder="Фикрингизни ёзинг..."></textarea>
      <button type="button" class="btn" onclick="submitNewForumTopicV2()">МАВЗУ ҚЎШИШ</button>
    </div>
    <button type="button" class="btn dark" style="margin-bottom:14px" onclick="showForumTop()">🏆 Фаол аъзолар</button>`;
    const topics = (db.forum||[]).slice().reverse().map(forumTopicCardV2).join('');
    return section(labels.forum, formHtml + (topics || empty()));
  }

  window.toggleReplyFormV2 = function(id){
    const el = document.getElementById('replyForm-'+id);
    if (el) el.style.display = (el.style.display==='none'||!el.style.display) ? 'block' : 'none';
  };
  window.startEditForumTopic = function(id){
    const el = document.getElementById('editForm-'+id);
    if (el) el.style.display = (el.style.display==='none'||!el.style.display) ? 'block' : 'none';
  };
  window.saveEditForumTopic = function(id){
    const title = (document.getElementById('editTitle-'+id)?.value||'').trim();
    const text = (document.getElementById('editText-'+id)?.value||'').trim();
    if (!title || !text) { alert('Сарлавҳа ва матнни киритинг'); return; }
    if (containsBadWords(title) || containsBadWords(text)) { alert('Хабарингизда номақбул сўзлар бор.'); return; }
    const t = (db.forum||[]).find(x=>x.id===id);
    if (!t || t.ownerToken !== currentIdentity()) { alert('Сизга бу мавзуни таҳрирлашга рухсат йўқ'); return; }
    t.title = title; t.text = text;
    save(); render();
  };
  window.delForumTopic = function(id){
    const t = (db.forum||[]).find(x=>x.id===id);
    if (!t || t.ownerToken !== currentIdentity()) { alert('Сизга бу мавзуни ўчиришга рухсат йўқ'); return; }
    if (!confirm('Ушбу мавзуни ўчирасизми?')) return;
    db.forum = db.forum.filter(x=>x.id!==id);
    save(); render();
  };
  window.submitNewForumTopicV2 = function(){
    const title = (document.getElementById('newForumTitle')?.value||'').trim();
    const text = (document.getElementById('newForumText')?.value||'').trim();
    const authorInput = document.getElementById('newForumAuthor');
    const author = currentMemberName() || (authorInput?authorInput.value.trim():'') || 'Мехмон';
    if (!title || !text) { alert('Мавзу сарлавҳаси ва матнини киритинг'); return; }
    if (containsBadWords(title) || containsBadWords(text)) { alert('Хабарингизда номақбул сўзлар бор.'); return; }
    db.forum.push({ id: Date.now(), title, author, text, replies: [], ownerToken: currentIdentity() });
    save(); render();
  };
  window.submitForumReplyV2 = function(id){
    const textEl = document.getElementById('replyText-'+id);
    const authorEl = document.getElementById('replyAuthor-'+id);
    const text = (textEl?.value||'').trim();
    const author = currentMemberName() || (authorEl?authorEl.value.trim():'') || 'Мехмон';
    if (!text) { alert('Жавоб матнини киритинг'); return; }
    if (containsBadWords(text)) { alert('Жавобингизда номақбул сўзлар бор.'); return; }
    const topic = (db.forum||[]).find(f=>f.id===id);
    if (!topic) return;
    if (!topic.replies) topic.replies = [];
    topic.replies.push({ id: Date.now(), author, text });
    save(); render();
  };

  // ---- Фаол аъзолар рейтинги ----
  window.showForumTop = function(){
    const counts = {};
    (db.forum||[]).forEach(f=>{
      counts[f.author] = (counts[f.author]||0) + 1;
      (f.replies||[]).forEach(r=>{ counts[r.author] = (counts[r.author]||0) + 1; });
    });
    const rows = Object.entries(counts).sort((a,b)=>b[1]-a[1]).slice(0,10)
      .map(([name,c],i)=>`<div class="listitem"><span>${i+1}. ${esc(name)}</span><span>${c} та ёзув</span></div>`).join('') || '<div class="empty">Ҳали ёзувлар йўқ</div>';
    showModal(`<button class="back" onclick="go('forum')">← Форум</button><h2>🏆 Фаол аъзолар</h2><div>${rows}</div>`);
  };

  // ================= 4. Галерея: аъзолар ўзи қўшиши (админ тасдиғи билан) =================
  function gallerySectionV2(){
    const formHtml = `<div class="form" style="margin-bottom:14px">
      <h3 style="margin:0;color:#f7d56b">📸 Ўз ижодингизни улашинг</h3>
      <input id="pubGalleryTitle" placeholder="Номи">
      <input id="pubGalleryImage" placeholder="Расм URL манзили (ихтиёрий)">
      <input id="pubGalleryVideo" placeholder="Видео URL манзили (ихтиёрий)">
      <button type="button" class="btn" onclick="submitPublicGallery()">ЮБОРИШ</button>
      <p class="small">Расм ёки видео URL манзилларидан камида биттасини киритинг. Юборилган контент админ/модератор тасдиқлагандан сўнг сайтда кўринади.</p>
    </div>`;
    const items = (db.gallery||[]).slice().reverse().map(g=>`<article class="card">${g.image?`<img class="thumb" src="${esc(g.image)}">`:''}<h3>${esc(g.title)}</h3><p>${esc(g.date||'')}${g.author?` • ${esc(g.author)}`:''}</p>${g.videoUrl?`<a class="pill" href="${esc(g.videoUrl)}" target="_blank">▶ Видеони очиш</a>`:''}</article>`).join('');
    return section(labels.gallery, formHtml + (items || empty()));
  }
  window.submitPublicGallery = function(){
    const title = (document.getElementById('pubGalleryTitle')?.value||'').trim();
    const image = (document.getElementById('pubGalleryImage')?.value||'').trim();
    const videoUrl = (document.getElementById('pubGalleryVideo')?.value||'').trim();
    if (!title) { alert('Номини киритинг'); return; }
    if (!image && !videoUrl) { alert('Расм ёки видео URL киритинг'); return; }
    const author = currentMemberName() || 'Мехмон';
    const o = { id: Date.now(), title, date: new Date().toLocaleDateString('uz-UZ'), author, status:'pending' };
    if (image) o.image = image;
    if (videoUrl) o.videoUrl = videoUrl;
    if (!db.galleryPending) db.galleryPending = [];
    db.galleryPending.push(o);
    save();
    alert('Раҳмат! Контентингиз юборилди, у админ/модератор тасдиқлашидан сўнг сайтда кўринади.');
    render();
  };

  // ---- Галерея тасдиқлаш (админ ва рухсатли модераторлар учун умумий) ----
  window.renderGalleryApproval = function(){
    const pending = db.galleryPending || [];
    const rows = pending.map(g=>`<div class="listitem" style="flex-direction:column;align-items:flex-start;gap:6px">
        <div>${g.image?`<img src="${esc(g.image)}" style="width:70px;height:70px;object-fit:cover;border-radius:8px;vertical-align:middle;margin-right:8px">`:''}<b>${esc(g.title)}</b> — ${esc(g.author||'')}${g.videoUrl?` <a href="${esc(g.videoUrl)}" target="_blank">(видео)</a>`:''}</div>
        <div style="display:flex;gap:8px"><button class="btn" onclick="approveGalleryItem(${g.id})">✅ Тасдиқлаш</button><button class="btn red" onclick="rejectGalleryItem(${g.id})">❌ Рад этиш</button></div>
      </div>`).join('') || '<div class="empty">Тасдиқлашни кутаётган контент йўқ</div>';
    const backTarget = (window.chinModeratorSession && window.chinModeratorSession()) ? 'showModeratorPanel' : 'showAdmin';
    showModal(`<button class="back" onclick="${backTarget}()">← Орқага</button><h2>🖼 Галереяни тасдиқлаш</h2><div>${rows}</div>`);
  };
  window.approveGalleryItem = function(id){
    const idx = (db.galleryPending||[]).findIndex(x=>x.id===id);
    if (idx===-1) return;
    const item = db.galleryPending[idx];
    delete item.status;
    db.gallery.push(item);
    db.galleryPending.splice(idx,1);
    save();
    renderGalleryApproval();
  };
  window.rejectGalleryItem = function(id){
    if (!confirm('Ушбу контентни рад этасизми?')) return;
    db.galleryPending = (db.galleryPending||[]).filter(x=>x.id!==id);
    save();
    renderGalleryApproval();
  };

  // ================= 5. Концерт эслатмаси (.ics) =================
  function concertCardV2(c){
    return `<article class="card"><h3>🎟 ${esc(c.city)}</h3><p>${esc(c.venue)}<br>${esc(c.date)}</p><span class="pill">${esc(c.tag)}</span><br><button type="button" class="btn dark" style="margin-top:8px" onclick="downloadConcertICS(${c.id})">📅 Эслатмага қўшиш</button></article>`;
  }
  window.downloadConcertICS = function(id){
    const c = (db.concerts||[]).find(x=>x.id===id);
    if (!c) return;
    let d = new Date(c.date);
    if (isNaN(d.getTime())) d = new Date();
    const pad = n => String(n).padStart(2,'0');
    const dt = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}T180000`;
    const summary = ('Концерт: '+(c.city||'')).replace(/[\n,;]/g,' ');
    const desc = (c.venue||'').replace(/[\n,;]/g,' ');
    const ics = `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nBEGIN:VEVENT\r\nSUMMARY:${summary}\r\nDTSTART:${dt}\r\nDESCRIPTION:${desc}\r\nEND:VEVENT\r\nEND:VCALENDAR`;
    const blob = new Blob([ics], {type:'text/calendar'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'concert.ics'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  };

  // ================= 6. content() тўлиқ маршрутлаш =================
  const _prevContent = window.content;
  window.content = function(p){
    if (p === 'news') return section(labels.news, (db.news||[]).slice().reverse().map(n=>`<article class="card"><span class="tag">${esc(n.cat)} • ${esc(n.date)}</span><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p>${likeBtn('news', n.id)}</article>`).join('') || empty());
    if (p === 'songs') return section(labels.songs, (db.songs||[]).slice().reverse().map(s=>`<article class="card"><div class="row"><div class="thumb" style="display:grid;place-items:center;font-size:34px">♫</div><div><h3>${esc(s.title)}</h3><p>${esc(s.artist)} • ${esc(s.date)}</p>${s.url?`<a class="pill" href="${esc(s.url)}" target="_blank">Очиш</a>`:''}${likeBtn('songs', s.id)}</div></div></article>`).join('') || empty());
    if (p === 'concerts') return section(labels.concerts, (db.concerts||[]).slice().reverse().map(concertCardV2).join('') || empty());
    if (p === 'forum') return forumSectionV2();
    if (p === 'gallery') return gallerySectionV2();
    return _prevContent(p);
  };

  // ================= 7. Админ: қидирув (умумий) =================
  const _prevShowModal = window.showModal;
  window.showModal = function(html){
    _prevShowModal(html);
    const box = document.getElementById('modalbox');
    if (!box) return;
    const items = box.querySelectorAll('.listitem');
    if (items.length > 3 && !box.querySelector('#adminSearchBox')) {
      const container = items[0].parentElement;
      const input = document.createElement('input');
      input.id = 'adminSearchBox';
      input.placeholder = '🔍 Излаш...';
      input.style.cssText = 'width:100%;box-sizing:border-box;padding:10px;margin:8px 0;border-radius:8px;border:1px solid #6c1b1d;background:#090404;color:#fff0dc';
      input.oninput = function(){
        const q = this.value.trim().toLowerCase();
        container.querySelectorAll('.listitem').forEach(function(li){
          li.style.display = li.textContent.toLowerCase().includes(q) ? '' : 'none';
        });
      };
      container.parentElement.insertBefore(input, container);
    }
  };

  // ================= 8. Админ: статистика =================
  const _prevShowAdmin = window.showAdmin;
  window.showAdmin = function(){
    _prevShowAdmin();
    const box = document.getElementById('modalbox');
    const nav = box && box.querySelector('.adminnav');
    if (nav && !document.getElementById('statsAdminBtn')) {
      const btn = document.createElement('button');
      btn.id = 'statsAdminBtn';
      btn.textContent = '📊 Статистика';
      btn.onclick = renderStats;
      nav.appendChild(btn);
      const sbtn = document.createElement('button');
      sbtn.id = 'socialAdminBtn';
      sbtn.textContent = '🔗 Ижтимоий тармоқлар';
      sbtn.onclick = renderSocialLinks;
      nav.appendChild(sbtn);
      const gbtn = document.createElement('button');
      gbtn.id = 'galleryApprovalAdminBtn';
      const pendingCount = (db.galleryPending||[]).length;
      gbtn.textContent = '🖼 Тасдиқлаш' + (pendingCount?` (${pendingCount})`:'');
      gbtn.onclick = renderGalleryApproval;
      nav.appendChild(gbtn);
      const mbtn = document.createElement('button');
      mbtn.id = 'moderatorsAdminBtn';
      mbtn.textContent = '👮 Модераторлар';
      mbtn.onclick = renderModeratorsAdmin;
      nav.appendChild(mbtn);
    }
  };
  function renderStats(){
    const types = ['news','songs','concerts','forum','members','gallery','videos','birthdays','notices'];
    const rows = types.map(t=>`<div class="listitem"><span>${icons[t]||''} ${labels[t]}</span><span>${(db[t]||[]).length}</span></div>`).join('');
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>📊 Статистика</h2><div>${rows}</div>`);
  }
  function renderSocialLinks(){
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>🔗 Ижтимоий тармоқлар</h2><div class="form">
      <input id="f_instagram" placeholder="Instagram URL" value="${esc(db.settings.instagramUrl||'')}">
      <input id="f_telegram" placeholder="Telegram URL" value="${esc(db.settings.telegramUrl||'')}">
      <button type="button" class="btn" onclick="saveSocialLinks()">САҚЛАШ</button>
    </div>`);
  }
  window.saveSocialLinks = function(){
    db.settings.instagramUrl = val('f_instagram');
    db.settings.telegramUrl = val('f_telegram');
    save();
    renderSocialLinks();
  };

  // ================= 9. Бош саҳифада ижтимоий тармоқ тугмалари =================
  const _prevHome = window.home;
  window.home = function(){
    let html = _prevHome();
    const ig = db.settings.instagramUrl, tg = db.settings.telegramUrl;
    if (ig || tg) {
      const links = `<div style="display:flex;gap:10px;justify-content:center;margin:10px 0 0;flex-wrap:wrap">
        ${ig?`<a href="${esc(ig)}" target="_blank" class="btn">📷 Instagram</a>`:''}
        ${tg?`<a href="${esc(tg)}" target="_blank" class="btn">✈️ Telegram</a>`:''}
      </div>`;
      html = html.replace('</section><div class="home-feature-grid', links + '</section><div class="home-feature-grid');
    }
    return html;
  };

  // ================= 10. Ёруғ/қоронғу режим =================
  window.chinToggleLight = function(){
    const on = document.documentElement.classList.toggle('light-mode');
    localStorage.setItem('chin_light_mode', on ? '1' : '0');
  };
  document.addEventListener('DOMContentLoaded', function(){
    if (localStorage.getItem('chin_light_mode') === '1') document.documentElement.classList.add('light-mode');
    const drawerBox = document.querySelector('.drawerbox');
    if (drawerBox && !document.getElementById('lightModeBtn')) {
      const btn = document.createElement('button');
      btn.id = 'lightModeBtn';
      btn.textContent = '☀️ / 🌙 Ёруғлик режими';
      btn.onclick = function(){ chinToggleLight(); };
      drawerBox.appendChild(btn);
    }
  });

  // ================= 11. Билдиришнома (браузер notification) =================
  function notifCounts(){
    return { news:(db.news||[]).length, songs:(db.songs||[]).length, concerts:(db.concerts||[]).length, notices:(db.notices||[]).length };
  }
  function checkForNewContent(){
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    let last = {};
    try{ last = JSON.parse(localStorage.getItem('chin_notif_counts')||'{}'); }catch(e){}
    const cur = notifCounts();
    const labelsMap = { news:'Янгилик', songs:'Қўшиқ', concerts:'Концерт', notices:'Билдиришнома' };
    Object.keys(cur).forEach(k=>{
      if (last[k] !== undefined && cur[k] > last[k]) {
        try{ new Notification('Чин Ошиқлар Фан-клуби', { body: 'Янги '+labelsMap[k]+' қўшилди!' }); }catch(e){}
      }
    });
    localStorage.setItem('chin_notif_counts', JSON.stringify(cur));
  }
  window.chinEnableNotifications = function(){
    if (!('Notification' in window)) { alert('Браузерингиз билдиришномани қўллаб-қувватламайди'); return; }
    Notification.requestPermission().then(function(perm){
      if (perm === 'granted') {
        localStorage.setItem('chin_notif_counts', JSON.stringify(notifCounts()));
        alert('Билдиришнома ёқилди!');
      }
    });
  };
  document.addEventListener('DOMContentLoaded', function(){
    const drawerBox = document.querySelector('.drawerbox');
    if (drawerBox && !document.getElementById('notifBtn')) {
      const btn = document.createElement('button');
      btn.id = 'notifBtn';
      btn.textContent = '🔔 Билдиришномани ёқиш';
      btn.onclick = function(){ chinEnableNotifications(); };
      drawerBox.appendChild(btn);
    }
    setInterval(checkForNewContent, 15000);
  });

  // ================= 12. Модераторлар тизими =================
  const MOD_PERM_TYPES = ['news','songs','concerts','forum','members','gallery','videos','birthdays','notices'];

  function moderatorsList(){ if (!db.moderators) db.moderators = []; return db.moderators; }

  window.chinModeratorSession = function(){
    try{ return JSON.parse(localStorage.getItem('chin_moderator_session')||'null'); }catch(e){ return null; }
  };

  let editingModeratorId = null;
  window.renderModeratorsAdmin = function(){
    const editing = editingModeratorId ? moderatorsList().find(m=>m.id===editingModeratorId) : null;
    const perms = (editing && editing.perms) || {};
    const permRows = MOD_PERM_TYPES.map(t=>`<label class="checkrow" style="justify-content:space-between;border-bottom:1px solid #321416;padding:6px 0"><span>${icons[t]||''} ${labels[t]}</span><input type="checkbox" data-perm="${t}" ${perms[t]?'checked':''}></label>`).join('');
    const galleryApprovePerm = `<label class="checkrow" style="justify-content:space-between;border-bottom:1px solid #321416;padding:6px 0"><span>🖼 Галереяни тасдиқлаш</span><input type="checkbox" id="permGalleryApprove" ${perms.galleryApprove?'checked':''}></label>`;
    const formHtml = `<div class="form">
      <input id="f_mod_name" placeholder="Модератор исми" value="${esc(editing?editing.name:'')}">
      <input id="f_mod_pin" placeholder="Модератор PIN коди (рақам)" value="${esc(editing?editing.pin:'')}">
      <p class="small" style="margin:6px 0 0">Модератор кира оладиган бўлимлар:</p>
      <div id="modPermsBox">${permRows}${galleryApprovePerm}</div>
      <button type="button" class="btn" onclick="saveModerator()">${editing?'ЎЗГАРИШЛАРНИ САҚЛАШ':'ҚЎШИШ'}</button>
      ${editing?'<button type="button" class="btn dark" onclick="cancelModeratorEdit()">БЕКОР ҚИЛИШ</button>':''}
    </div>`;
    const listHtml = `<hr style="border-color:#321416"><div>${moderatorsList().map(m=>`<div class="listitem"><span>${esc(m.name)} (PIN: ${esc(m.pin)})</span><span style="display:flex;gap:6px"><button class="btn" onclick="startModeratorEdit(${m.id})">ТАҲРИР</button><button class="btn red" onclick="delModerator(${m.id})">ЎЧИРИШ</button></span></div>`).join('')}</div>`;
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>👮 Модераторлар</h2>${formHtml}${listHtml}`);
  };
  window.startModeratorEdit = function(id){ editingModeratorId = id; renderModeratorsAdmin(); };
  window.cancelModeratorEdit = function(){ editingModeratorId = null; renderModeratorsAdmin(); };
  window.delModerator = function(id){
    if (!confirm('Ушбу модераторни ўчирасизми?')) return;
    db.moderators = moderatorsList().filter(m=>m.id!==id);
    if (editingModeratorId===id) editingModeratorId = null;
    save();
    renderModeratorsAdmin();
  };
  window.saveModerator = function(){
    const name = val('f_mod_name'), pin = val('f_mod_pin');
    if (!name || !pin) { alert('Исм ва PIN кодини киритинг'); return; }
    const box = document.getElementById('modPermsBox');
    const perms = {};
    box.querySelectorAll('[data-perm]').forEach(inp=>{ perms[inp.getAttribute('data-perm')] = inp.checked; });
    perms.galleryApprove = !!document.getElementById('permGalleryApprove').checked;
    if (editingModeratorId) {
      const m = moderatorsList().find(x=>x.id===editingModeratorId);
      if (m) { m.name = name; m.pin = pin; m.perms = perms; }
      editingModeratorId = null;
    } else {
      db.moderators.push({ id: Date.now(), name, pin, perms });
    }
    save();
    renderModeratorsAdmin();
  };

  // ---- Модератор кириши ва панели ----
  window.openModeratorLogin = function(){
    showModal(`<h2>🛡 Модератор кириши</h2><div class="form"><input id="modLoginPin" type="password" placeholder="Модератор PIN коди"><button class="btn" onclick="moderatorLogin()">КИРИШ</button></div>`);
  };
  window.moderatorLogin = function(){
    const pin = (document.getElementById('modLoginPin')?.value||'').trim();
    const mod = moderatorsList().find(m=>m.pin===pin);
    if (!mod) { alert('PIN нотўғри'); return; }
    localStorage.setItem('chin_moderator_session', JSON.stringify({ id: mod.id, name: mod.name, perms: mod.perms }));
    closeModal();
    showModeratorPanel();
  };
  window.showModeratorPanel = function(){
    const sess = chinModeratorSession();
    if (!sess) { openModeratorLogin(); return; }
    const perms = sess.perms || {};
    const buttons = MOD_PERM_TYPES.filter(t=>perms[t]).map(t=>`<button onclick="adminEdit('${t}')">${icons[t]||''} ${labels[t]}</button>`).join('');
    const galleryBtn = perms.galleryApprove ? `<button onclick="renderGalleryApproval()">🖼 Галереяни тасдиқлаш</button>` : '';
    showModal(`<h2>🛡 Модератор панели — ${esc(sess.name)}</h2><p class="small">Сизга рухсат берилган бўлимлар шу ердан бошқарилади.</p><div class="adminnav">${buttons}${galleryBtn}</div><div class="actions"><button class="btn dark" onclick="moderatorLogout()">Чиқиш</button><button class="btn dark" onclick="closeModal()">Сайтга қайтиш</button></div>`);
  };
  window.moderatorLogout = function(){
    localStorage.removeItem('chin_moderator_session');
    closeModal();
  };

  document.addEventListener('DOMContentLoaded', function(){
    const drawerBox = document.querySelector('.drawerbox');
    if (drawerBox && !document.getElementById('modLoginDrawerBtn')) {
      const btn = document.createElement('button');
      btn.id = 'modLoginDrawerBtn';
      btn.textContent = '🛡 Модератор кириши';
      btn.onclick = function(){
        closeDrawer();
        if (chinModeratorSession()) showModeratorPanel(); else openModeratorLogin();
      };
      drawerBox.appendChild(btn);
    }
  });
})();
</script>


<script id="chin-mega-features-2">
(function(){
  function esc2(x){ return typeof esc==='function' ? esc(x) : String(x==null?'':x); }
  function identity(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      const u = s && (s.user||s);
      if (u && u.email) return 'u_'+u.email;
    }catch(e){}
    let t = localStorage.getItem('chin_guest_token');
    if (!t) { t = 'g_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); localStorage.setItem('chin_guest_token', t); }
    return t;
  }
  function memberName(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      const u = s && (s.user||s);
      const meta = (u && u.user_metadata) || {};
      return meta.name || meta.full_name || '';
    }catch(e){ return ''; }
  }
  function memberEmail(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      const u = s && (s.user||s);
      return (u && u.email) || '';
    }catch(e){ return ''; }
  }

  // ================= A. Аъзо даражаси (баллар) =================
  function myPostCount(){
    let c = 0;
    (db.forum||[]).forEach(f=>{
      if (f.ownerToken === identity()) c++;
      (f.replies||[]).forEach(r=>{ if (r.ownerToken === identity()) c++; });
    });
    return c;
  }
  function badgeFor(count){
    if (count >= 30) return '🥇 Олтин аъзо';
    if (count >= 10) return '🥈 Фаол аъзо';
    if (count >= 1) return '🥉 Янги аъзо';
    return '— Ҳали фаол эмас';
  }
  const _prevChinOpenProfile = window.chinOpenProfile;
  window.chinOpenProfile = function(){
    _prevChinOpenProfile();
    const modal = document.getElementById('chinProfileModal');
    if (!modal) return;
    let badgeEl = document.getElementById('chinProfileBadge');
    const count = myPostCount();
    if (!badgeEl) {
      const box = modal.querySelector('div');
      badgeEl = document.createElement('p');
      badgeEl.id = 'chinProfileBadge';
      const since = document.getElementById('chinPSince');
      if (since && since.parentElement) since.parentElement.insertAdjacentElement('afterend', badgeEl);
      else box.appendChild(badgeEl);
    }
    badgeEl.innerHTML = '<b>Даражангиз:</b> ' + badgeFor(count) + ' <span style="color:#a99">(' + count + ' та ёзув)</span>';
  };

  // ================= B. Хусусий хабарлар (аъзолар орасида) =================
  function myMessages(){
    const me = memberEmail();
    if (!me) return [];
    return (db.messages||[]).filter(m=>m.toEmail===me || m.fromEmail===me);
  }
  window.openMessages = function(){
    if (!memberEmail()) { alert('Хабарлар учун тизимга киришингиз керак'); return; }
    const msgs = myMessages().slice().reverse();
    const me = memberEmail();
    const rows = msgs.map(m=>`<div class="listitem" style="flex-direction:column;align-items:flex-start">
        <div><b>${m.fromEmail===me?'Сиз → '+esc2(m.toName||m.toEmail):esc2(m.fromName||m.fromEmail)+' → сизга'}</b></div>
        <div>${esc2(m.text)}</div>
      </div>`).join('') || '<div class="empty">Ҳали хабар йўқ</div>';
    const memberOptions = (db.members||[]).map(m=>`<option value="${esc2(m.name)}">${esc2(m.name)}</option>`).join('');
    showModal(`<button class="back" onclick="chinCloseProfile()">← Ёпиш</button><h2>✉ Хабарлар</h2>
      <div class="form">
        <select id="msgToName"><option value="">Аъзони танланг...</option>${memberOptions}</select>
        <input id="msgToEmail" placeholder="ёки қабул қилувчи email манзили">
        <textarea id="msgText" placeholder="Хабарингиз..."></textarea>
        <button type="button" class="btn" onclick="sendMemberMessage()">ЮБОРИШ</button>
      </div>
      <hr style="border-color:#321416"><div>${rows}</div>`);
  };
  window.sendMemberMessage = function(){
    const me = memberEmail();
    if (!me) { alert('Тизимга киринг'); return; }
    const toName = val('msgToName');
    let toEmail = val('msgToEmail');
    const text = val('msgText');
    if (!text || (!toName && !toEmail)) { alert('Қабул қилувчи ва хабар матнини киритинг'); return; }
    if (!db.messages) db.messages = [];
    db.messages.push({ id: Date.now(), fromEmail: me, fromName: memberName()||me, toEmail: toEmail||'', toName: toName||toEmail, text, ts: Date.now() });
    save();
    openMessages();
  };

  // ================= C. Юлдузча рейтинг (қўшиқ/концерт) =================
  function ratingKey(type,id){ return type+'_'+id; }
  function myRatings(){ try{ return JSON.parse(localStorage.getItem('chin_my_ratings')||'{}'); }catch(e){ return {}; } }
  window.rateItem = function(type, id, stars){
    if (!db.ratings) db.ratings = {};
    const key = ratingKey(type,id);
    const mine = myRatings();
    const r = db.ratings[key] || { sum:0, count:0 };
    if (mine[key]) { r.sum -= mine[key]; r.count = Math.max(0, r.count-1); }
    r.sum += stars; r.count += 1;
    db.ratings[key] = r;
    mine[key] = stars;
    localStorage.setItem('chin_my_ratings', JSON.stringify(mine));
    save();
    render();
  };
  function starsHtml(type,id){
    const key = ratingKey(type,id);
    const r = (db.ratings && db.ratings[key]) || { sum:0, count:0 };
    const avg = r.count ? (r.sum/r.count) : 0;
    const mine = myRatings()[key] || 0;
    let stars = '';
    for (let i=1;i<=5;i++){
      stars += `<span onclick="rateItem('${type}',${id},${i})" style="cursor:pointer;font-size:16px">${i<=mine?'⭐':'☆'}</span>`;
    }
    return `<div style="margin-top:6px">${stars} <span class="small">(${avg.toFixed(1)}, ${r.count} овоз)</span></div>`;
  }

  // ================= D. Улашиш тугмаси =================
  function shareBtn(title, text){
    const safe = (title||'').replace(/'/g,"\\'");
    return `<button type="button" class="btn dark" style="margin-top:8px" onclick="chinShare('${safe}')">📤 Улашиш</button>`;
  }
  window.chinShare = function(title){
    if (navigator.share) {
      navigator.share({ title: 'Чин Ошиқлар Фан-клуби', text: title, url: location.href }).catch(()=>{});
    } else {
      navigator.clipboard && navigator.clipboard.writeText(title + ' — ' + location.href);
      alert('Ҳавола нусхаланди!');
    }
  };

  // ================= E. Аудио плеер (қўшиқлар учун) =================
  function isAudioUrl(u){ return /\.(mp3|ogg|wav|m4a)(\?|$)/i.test(u||''); }

  // ================= F. Форумда вақтинчалик блоклаш =================
  function bannedNames(){ return db.bannedNames || []; }
  function isBannedName(name){ return bannedNames().map(n=>n.toLowerCase()).includes((name||'').toLowerCase()); }

  const _prevSubmitTopic = window.submitNewForumTopicV2;
  window.submitNewForumTopicV2 = function(){
    const nm = memberName() || (document.getElementById('newForumAuthor')?.value||'').trim();
    if (nm && isBannedName(nm)) { alert('Сиз форумда вақтинча блокланган сиз'); return; }
    _prevSubmitTopic();
  };
  const _prevSubmitReply = window.submitForumReplyV2;
  window.submitForumReplyV2 = function(id){
    const nm = memberName() || (document.getElementById('replyAuthor-'+id)?.value||'').trim();
    if (nm && isBannedName(nm)) { alert('Сиз форумда вақтинча блокланган сиз'); return; }
    _prevSubmitReply(id);
  };

  // ================= G. Умумий қидирув =================
  window.openGlobalSearch = function(){
    showModal(`<h2>🔎 Сайт бўйича қидирув</h2><div class="form"><input id="globalSearchInput" placeholder="Излаш..." oninput="runGlobalSearch()"></div><div id="globalSearchResults"></div>`);
    setTimeout(()=>document.getElementById('globalSearchInput')?.focus(), 50);
  };
  window.runGlobalSearch = function(){
    const q = (document.getElementById('globalSearchInput')?.value||'').trim().toLowerCase();
    const box = document.getElementById('globalSearchResults');
    if (!box) return;
    if (!q) { box.innerHTML = ''; return; }
    let results = [];
    (db.news||[]).forEach(n=>{ if ((n.title+' '+n.text).toLowerCase().includes(q)) results.push({type:'📰 Янгилик', title:n.title, go:'news'}); });
    (db.songs||[]).forEach(s=>{ if ((s.title+' '+(s.artist||'')).toLowerCase().includes(q)) results.push({type:'🎵 Қўшиқ', title:s.title, go:'songs'}); });
    (db.forum||[]).forEach(f=>{ if ((f.title+' '+f.text).toLowerCase().includes(q)) results.push({type:'💬 Форум', title:f.title, go:'forum'}); });
    box.innerHTML = results.slice(0,20).map(r=>`<div class="listitem" style="cursor:pointer" onclick="closeModal();go('${r.go}')"><span>${r.type}</span><span>${esc2(r.title)}</span></div>`).join('') || '<div class="empty">Ҳеч нарса топилмади</div>';
  };

  // ================= H. Ёрлиқ хабарлар журнали (аудит лог) =================
  function auditLog(entry){
    if (!db.auditLog) db.auditLog = [];
    db.auditLog.push({ ts: Date.now(), text: entry });
    if (db.auditLog.length > 200) db.auditLog = db.auditLog.slice(-200);
  }
  window.chinAudit = auditLog;
  window.renderAuditLog = function(){
    const rows = (db.auditLog||[]).slice().reverse().map(a=>`<div class="listitem"><span>${new Date(a.ts).toLocaleString('uz-UZ')}</span><span>${esc2(a.text)}</span></div>`).join('') || '<div class="empty">Ҳали ҳаракатлар йўқ</div>';
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>📜 Ҳаракатлар журнали</h2><div>${rows}</div>`);
  };
  const _prevApproveGallery = window.approveGalleryItem;
  window.approveGalleryItem = function(id){
    const item = (db.galleryPending||[]).find(x=>x.id===id);
    _prevApproveGallery(id);
    if (item) auditLog('Тасдиқланди: "'+item.title+'" ('+(item.author||'')+')');
  };
  const _prevRejectGallery = window.rejectGalleryItem;
  window.rejectGalleryItem = function(id){
    const item = (db.galleryPending||[]).find(x=>x.id===id);
    if (item && confirm('Ушбу контентни рад этасизми?')) { /* underlying confirm already asked; avoid double */ }
    _prevRejectGallery(id);
  };
  const _prevSaveModerator = window.saveModerator;
  window.saveModerator = function(){
    _prevSaveModerator();
    auditLog('Модератор сақланди/қўшилди');
  };
  const _prevDelModerator = window.delModerator;
  window.delModerator = function(id){
    _prevDelModerator(id);
    auditLog('Модератор ўчирилди (id:'+id+')');
  };

  // ================= I. Форум блоклари — админ бошқаруви =================
  window.renderForumBans = function(){
    const list = bannedNames();
    const rows = list.map(n=>`<div class="listitem"><span>${esc2(n)}</span><button class="btn red" onclick="unbanForumName('${esc2(n).replace(/'/g,"\\'")}')">Блокдан чиқариш</button></div>`).join('') || '<div class="empty">Блокланганлар йўқ</div>';
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>🚫 Форум блоклари</h2><div class="form"><input id="banNameInput" placeholder="Исм (форумдаги номи бўйича)"><button type="button" class="btn" onclick="banForumName()">БЛОКЛАШ</button></div><hr style="border-color:#321416"><div>${rows}</div>`);
  };
  window.banForumName = function(){
    const n = (document.getElementById('banNameInput')?.value||'').trim();
    if (!n) return;
    if (!db.bannedNames) db.bannedNames = [];
    if (!isBannedName(n)) db.bannedNames.push(n);
    save();
    auditLog('Форумда блокланди: '+n);
    renderForumBans();
  };
  window.unbanForumName = function(n){
    db.bannedNames = bannedNames().filter(x=>x.toLowerCase()!==n.toLowerCase());
    save();
    auditLog('Форум блоки олиб ташланди: '+n);
    renderForumBans();
  };

  // ================= J. Заҳира нусха (backup) =================
  window.downloadBackup = function(){
    const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'chin-oshiqlar-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  };

  // ================= K. Админ панелга қўшимча тугмалар =================
  const _prevShowAdmin2 = window.showAdmin;
  window.showAdmin = function(){
    _prevShowAdmin2();
    const box = document.getElementById('modalbox');
    const nav = box && box.querySelector('.adminnav');
    if (nav && !document.getElementById('auditLogBtn')) {
      [['auditLogBtn','📜 Ҳаракатлар журнали', renderAuditLog],
       ['forumBansBtn','🚫 Форум блоклари', renderForumBans],
       ['backupBtn','💾 Заҳира нусха', downloadBackup]].forEach(([id,txt,fn])=>{
        const b = document.createElement('button');
        b.id = id; b.textContent = txt; b.onclick = fn;
        nav.appendChild(b);
      });
    }
  };

  // ================= L. content(): пин, юлдузча, аудио, улашиш, лайтбокс =================
  const _prevContent2 = window.content;
  window.content = function(p){
    if (p === 'news') {
      const items = (db.news||[]).slice().sort((a,b)=>{
        const pa = a.pinned?1:0, pb = b.pinned?1:0;
        if (pa!==pb) return pb-pa;
        return b.id - a.id;
      });
      const html = items.map(n=>`<article class="card">${n.pinned?'<span class="pill">📌 Муҳим</span>':''}<span class="tag">${esc2(n.cat)} • ${esc2(n.date)}</span><h3>${esc2(n.title)}</h3><p>${esc2(n.text)}</p>${typeof likeBtnGlobal==='function'?likeBtnGlobal('news',n.id):''}${shareBtn(n.title)}</article>`).join('') || (typeof empty==='function'?empty():'');
      return section(labels.news, html);
    }
    if (p === 'songs') {
      const html = (db.songs||[]).slice().reverse().map(s=>`<article class="card"><div class="row"><div class="thumb" style="display:grid;place-items:center;font-size:34px">♫</div><div><h3>${esc2(s.title)}</h3><p>${esc2(s.artist)} • ${esc2(s.date)}</p>${s.url?(isAudioUrl(s.url)?`<audio controls style="width:100%;margin-top:6px" src="${esc2(s.url)}"></audio>`:`<a class="pill" href="${esc2(s.url)}" target="_blank">Очиш</a>`):''}${starsHtml('songs',s.id)}${shareBtn(s.title)}</div></div></article>`).join('') || (typeof empty==='function'?empty():'');
      return section(labels.songs, html);
    }
    if (p === 'concerts') {
      const html = (db.concerts||[]).slice().reverse().map(c=>`<article class="card"><h3>🎟 ${esc2(c.city)}</h3><p>${esc2(c.venue)}<br>${esc2(c.date)}</p><span class="pill">${esc2(c.tag)}</span>${starsHtml('concerts',c.id)}<br>${typeof downloadConcertICS==='function'?`<button type="button" class="btn dark" style="margin-top:8px" onclick="downloadConcertICS(${c.id})">📅 Эслатмага қўшиш</button>`:''}${shareBtn(c.city)}</article>`).join('') || (typeof empty==='function'?empty():'');
      return section(labels.concerts, html);
    }
    let out = _prevContent2(p);
    if (p === 'gallery' && typeof out === 'string') {
      // расмларга лайтбокс (катталаштириб кўриш)
      out = out.replace(/<img class="thumb" src="([^"]*)">/g, '<img class="thumb" src="$1" style="cursor:pointer" onclick="chinLightbox(this.src)">');
    }
    return out;
  };
  window.chinLightbox = function(src){
    showModal(`<button class="back" onclick="closeModal();go('${page}')">← Ёпиш</button><div style="text-align:center"><img src="${src}" style="max-width:100%;border-radius:12px"></div>`);
  };

  // Аниқлик учун лайк тугмаси global функцияга боғланади (chin-mega-features дан)
  window.likeBtnGlobal = function(type,id){
    if (typeof window.toggleLike !== 'function') return '';
    if (!db.reactions) db.reactions = {};
    const key = type+'_'+id;
    const count = db.reactions[key] || 0;
    let liked = false;
    try{ liked = new Set(JSON.parse(localStorage.getItem('chin_liked')||'[]')).has(key); }catch(e){}
    return `<button type="button" class="btn dark" style="margin-top:8px" onclick="toggleLike('${type}',${id})">${liked?'❤️':'🤍'} ${count}</button>`;
  };

  // ================= M. Янгиликни пинлаш (админ) =================
  window.togglePinNews = function(id){
    const n = (db.news||[]).find(x=>x.id===id);
    if (!n) return;
    n.pinned = !n.pinned;
    save(); render();
  };

  // ================= N. Туғилган кун эслатмаси =================
  function parseUpcomingBirthday(dateStr){
    if (!dateStr) return null;
    const parts = dateStr.match(/(\d{1,2})[.\/-](\d{1,2})/);
    if (!parts) return null;
    const day = parseInt(parts[1],10), month = parseInt(parts[2],10)-1;
    const now = new Date();
    let next = new Date(now.getFullYear(), month, day);
    if (next < now) next = new Date(now.getFullYear()+1, month, day);
    const diffDays = Math.ceil((next - now) / 86400000);
    return diffDays;
  }
  function checkBirthdayReminders(){
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    let notified = {};
    try{ notified = JSON.parse(localStorage.getItem('chin_bday_notified')||'{}'); }catch(e){}
    (db.birthdays||[]).forEach(b=>{
      const diff = parseUpcomingBirthday(b.date);
      if (diff !== null && diff <= 3 && diff >= 0) {
        const key = b.id+'_'+new Date().getFullYear();
        if (!notified[key]) {
          try{ new Notification('🎂 Туғилган кун яқинлашмоқда', { body: (b.name||'')+' - '+diff+' кундан сўнг' }); }catch(e){}
          notified[key] = true;
        }
      }
    });
    localStorage.setItem('chin_bday_notified', JSON.stringify(notified));
  }

  // ================= O. Байрам/юбилей конфетти эффекти =================
  function maybeConfetti(){
    const specialDates = ['01-01','03-21','12-31'];
    const today = new Date();
    const key = String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
    if (!specialDates.includes(key)) return;
    if (sessionStorage.getItem('chin_confetti_shown')) return;
    sessionStorage.setItem('chin_confetti_shown','1');
    const colors = ['#f7d56b','#e0a3f0','#6bd0f7','#7be08a','#f76b6b'];
    for (let i=0;i<60;i++){
      const el = document.createElement('div');
      el.style.cssText = `position:fixed;top:-20px;left:${Math.random()*100}vw;width:8px;height:8px;background:${colors[i%colors.length]};z-index:999999;border-radius:2px;pointer-events:none;transition:transform 3s linear,opacity 3s linear`;
      document.body.appendChild(el);
      setTimeout(()=>{ el.style.transform = `translateY(110vh) rotate(${360+Math.random()*360}deg)`; el.style.opacity='0'; }, 30);
      setTimeout(()=>el.remove(), 3200);
    }
  }

  // ================= P. Тил алмаштириш (навигация ёрлиқлари учун, қисман) =================
  const I18N = {
    ru: { news:'Новости', songs:'Песни', concerts:'Концерты', forum:'Форум', members:'Участники', gallery:'Творчество фанклуба', videos:'Видео', birthdays:'Дни рождения', notices:'Уведомления' },
    en: { news:'News', songs:'Songs', concerts:'Concerts', forum:'Forum', members:'Members', gallery:'Fan Creations', videos:'Videos', birthdays:'Birthdays', notices:'Notices' }
  };
  let originalLabels = null;
  window.chinSetLanguage = function(lang){
    if (!originalLabels) originalLabels = Object.assign({}, labels);
    if (lang === 'uz' || !I18N[lang]) {
      Object.assign(labels, originalLabels);
    } else {
      Object.assign(labels, originalLabels, I18N[lang]);
    }
    localStorage.setItem('chin_lang', lang);
    render();
  };
  document.addEventListener('DOMContentLoaded', function(){
    const saved = localStorage.getItem('chin_lang');
    if (saved && saved !== 'uz') setTimeout(()=>chinSetLanguage(saved), 300);
  });

  // ================= Q. Drawer'га қўшимча тугмалар =================
  document.addEventListener('DOMContentLoaded', function(){
    const drawerBox = document.querySelector('.drawerbox');
    if (drawerBox && !document.getElementById('globalSearchDrawerBtn')) {
      const btn1 = document.createElement('button');
      btn1.id = 'globalSearchDrawerBtn';
      btn1.textContent = '🔎 Сайт бўйича қидирув';
      btn1.onclick = function(){ closeDrawer(); openGlobalSearch(); };
      drawerBox.appendChild(btn1);

      const btn2 = document.createElement('button');
      btn2.id = 'messagesDrawerBtn';
      btn2.textContent = '✉ Хабарлар';
      btn2.onclick = function(){ closeDrawer(); openMessages(); };
      drawerBox.appendChild(btn2);

      const langSel = document.createElement('select');
      langSel.id = 'langSelectDrawer';
      langSel.style.cssText = 'margin:6px 14px;padding:10px;border-radius:8px;border:1px solid #4d1a1b;background:#0a0506;color:#fff';
      langSel.innerHTML = '<option value="uz">🇺🇿 Ўзбекча</option><option value="ru">🇷🇺 Русский</option><option value="en">🇬🇧 English</option>';
      langSel.value = localStorage.getItem('chin_lang') || 'uz';
      langSel.onchange = function(){ chinSetLanguage(this.value); closeDrawer(); };
      drawerBox.appendChild(langSel);
    }
    setTimeout(maybeConfetti, 500);
    setInterval(checkBirthdayReminders, 20000);
    checkBirthdayReminders();
  });
})();
</script>

<script id="chin-bottom-profile-nav-fix">
(function(){
  window.chinBottomProfileClick = function(){
    let session = null;
    try{ session = JSON.parse(localStorage.getItem('chin_member_session')||'null'); }catch(e){}
    if (session && (session.access_token || session.user)) {
      chinOpenProfile();
    } else {
      chinOpenLogin();
    }
  };
})();
</script>
