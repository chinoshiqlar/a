<style id="chin-unified-sections">
/* Барча контент бўлимлари бир хил замонавий карточка услубида */
:root{
  --club-bg:#100607;
  --club-panel:#21090b;
  --club-panel2:#2d0d10;
  --club-border:#9b6a18;
  --club-accent:#f1cc63;
  --club-text:#fff4df;
  --club-muted:#cdbca8;
}
.chin-section-card,
.news-section,.songs-section,.videos-section,.gallery-section,.notices-section,
.concerts-section,.birthdays-section,.members-section,.forum-section{
  border:1px solid var(--club-border)!important;
  border-radius:18px!important;
  background:linear-gradient(145deg,var(--club-panel),var(--club-bg))!important;
  color:var(--club-text)!important;
  box-shadow:0 8px 26px rgba(0,0,0,.25)!important;
}
.chin-section-card h1,.chin-section-card h2,.chin-section-card h3,
.news-section h1,.news-section h2,.news-section h3,
.songs-section h1,.songs-section h2,.songs-section h3,
.videos-section h1,.videos-section h2,.videos-section h3{
  color:var(--club-accent)!important;
}
.chin-logo img,.site-logo img,.logo img{
  transition:filter .25s ease,opacity .25s ease;
}
.theme-green{
  --club-bg:#06140b;
  --club-panel:#0b2516;
  --club-panel2:#10351e;
  --club-border:#3d9b5b;
  --club-accent:#8de39d;
  --club-text:#effff3;
  --club-muted:#b7d9bf;
}
.theme-green .chin-logo img,.theme-green .site-logo img,.theme-green .logo img{
  filter:hue-rotate(75deg) saturate(1.25);
}
</style>

<style id="chin-member-registration-css">
#memberRegBtn{position:fixed;right:16px;bottom:155px;z-index:9999;border:1px solid #9b6a18;background:linear-gradient(145deg,#35100b,#170607);color:#f7d56b;border-radius:999px;padding:11px 15px;font-weight:800;box-shadow:0 5px 18px #0008}
#memberRegOverlay{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:18px;background:#000b}

#memberRegBox h2{margin:0 0 8px;color:#f7d56b}
#memberRegBox p{color:#cdbca8;font-size:13px}
#memberRegBox input{width:100%;box-sizing:border-box;margin:7px 0;padding:13px;border-radius:12px;border:1px solid #6c1b1d;background:#090404;color:#fff0dc;outline:none}

.member-public-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.member-public-card{border:1px solid #9b6a18;border-radius:16px;padding:14px;background:linear-gradient(145deg,#25080b,#0e0405);color:#fff0dc}
.member-public-card strong{display:block;color:#f7d56b;font-size:17px}
.member-public-card small{display:block;color:#cdbca8;margin-top:5px}
.theme-green #memberRegBtn{border-color:#3d9b5b;background:linear-gradient(145deg,#0b2516,#06140b);color:#8de39d}
.theme-green #memberRegBox{border-color:#3d9b5b;background:linear-gradient(145deg,#0b2516,#06140b)}
.theme-green #memberRegBox h2,#theme-green #memberListPublic h2{color:#8de39d}
.theme-green .member-public-card{border-color:#3d9b5b;background:linear-gradient(145deg,#0b2516,#06140b)}
.theme-green .member-public-card strong{color:#8de39d}
</style>

let db=load(),page='home',admin=false,cloudReady=false;
const NOTICE_READ_KEY='chin_oshiklar_read_notices_v1';
function getReadNoticeIds(){try{return JSON.parse(localStorage.getItem(NOTICE_READ_KEY)||'[]')}catch(e){return[]}}
function unreadNoticeCount(){const read=new Set(getReadNoticeIds());return (db.notices||[]).filter(n=>!read.has(String(n.id))).length}
function markAllNoticesRead(){const ids=(db.notices||[]).map(n=>String(n.id));localStorage.setItem(NOTICE_READ_KEY,JSON.stringify(ids));}
function load(){try{let x=JSON.parse(localStorage.getItem(KEY))||structuredClone(initial);x.settings=x.settings||{};if(!x.settings.theme)x.settings.theme='gold';if(!['gold','blue','redgold','green'].includes(x.settings.theme))x.settings.theme='gold';if(x.settings.cardRadius==null)x.settings.cardRadius=16;if(x.settings.borderWidth==null)x.settings.borderWidth=2;if(x.settings.showHomeFeatures==null)x.settings.showHomeFeatures=true;if(!x.settings.backgroundStyle)x.settings.backgroundStyle='gradient';return x}catch(e){return structuredClone(initial)}}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function logo(){
  if(db.settings.logo) return db.settings.logo;
  const t=db.settings.theme||'gold';
  if(t==='blue') return LOGO_BLUE;
  if(t==='green') return LOGO_GREEN;
  if(t==='redgold') return LOGO_RED;
  return HERO_LOGO;
}
const labels={news:'Янгиликлар',songs:'Қўшиқлар',concerts:'Концертлар',forum:'Форум',members:'Аъзолар',gallery:'Фанклуб ижодидан',videos:'Видео',birthdays:'Туғилган кунлар',notices:'Билдиришнома'};
const icons={news:'▤',songs:'♫',concerts:'🎟',forum:'☏',members:'♟',gallery:'▧',videos:'▶',birthdays:'♨',notices:'◇'};
async function cloudLoad(){try{const r=await fetch(`${SUPABASE_URL}/rest/v1/fanclub_data?id=eq.1&select=data`,{headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`}});if(!r.ok)throw Error(r.status);const rows=await r.json();if(rows[0]?.data){db=rows[0].data;localStorage.setItem(KEY,JSON.stringify(db))}else await cloudSave(true);cloudReady=true;render()}catch(e){cloudReady=false;render()}}
async function cloudSave(silent=false){localStorage.setItem(KEY,JSON.stringify(db));try{const r=await fetch(`${SUPABASE_URL}/rest/v1/fanclub_data`,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:`Bearer ${SUPABASE_KEY}`,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({id:1,data:db,updated_at:new Date().toISOString()})});if(!r.ok)throw Error(r.status);cloudReady=true;if(!silent)toast('Маълумот онлайн сақланди ✓')}catch(e){cloudReady=false;if(!silent)toast('Онлайн сақлашда хато')} }
function save(){cloudSave()}
function toast(m){const t=document.createElement('div');t.textContent=m;t.style='position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:200;background:#19080a;border:1px solid #d9a52d;color:#f7d56b;padding:11px 16px;border-radius:12px';document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function applyTheme(){const t=db.settings?.theme||'gold';document.documentElement.classList.toggle('theme-blue',t==='blue');document.documentElement.classList.toggle('theme-redgold',t==='redgold');document.documentElement.classList.toggle('theme-gold',t==='gold');document.documentElement.classList.toggle('theme-green',t==='green');document.documentElement.classList.toggle('theme-black',t==='black');document.documentElement.classList.toggle('theme-purple',t==='purple');const r=Math.max(0,Math.min(30,Number(db.settings?.cardRadius??16)));const bw=Math.max(1,Math.min(5,Number(db.settings?.borderWidth??2)));document.documentElement.style.setProperty('--custom-radius',r+'px');document.documentElement.style.setProperty('--custom-border',bw+'px');document.documentElement.dataset.bgstyle=db.settings?.backgroundStyle||'gradient'}
function render(){applyTheme();document.getElementById('app').innerHTML=`<header class="top"><button class="hamb" onclick="openDrawer()">☰</button><div class="topright"><span class="topicon">♧<b class="badge" style="${unreadNoticeCount()===0?'display:none':''}">${unreadNoticeCount()}</b></span><span class="club"><span>♧</span>KLUB</span></div></header><main>${page==='home'?home():content(page)}</main><nav class="bottom"><div class="bottomin"><button class="nav ${page==='home'?'active':''}" onclick="go('home')"><span class="nicon">⌂</span>Бош саҳифа</button><button class="nav ${page==='forum'?'active':''}" onclick="go('forum')"><span class="nicon">☏</span>Форум</button><button class="nav" onclick="go('home')"><span class="heart">♥</span></button><button class="nav ${page==='members'?'active':''}" onclick="go('members')"><span class="nicon">♟</span>Аъзолар</button><button class="nav" onclick="chinBottomProfileClick()"><span class="nicon">♙</span>Профиль</button></div></nav>`}
function home(){const _rt=db.settings.theme||'gold';const _useFilter=!db.settings.logo&&!(['blue','green','redgold'].includes(_rt));return `<section class="hero"><img class="${_useFilter?'hero-logo':''}" src="${logo()}"><div class="dots"><i class="dot active"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div></section><div class="home-feature-grid uniform-sections" style="display:${db.settings?.showHomeFeatures===false?'none':'grid'}">${Object.keys(labels).map(p=>`<button class="home-feature" onclick="go('${p}')"><span class="ico">${icons[p]}</span><small>${labels[p]}</small></button>`).join('')}</div><section class="section"><div class="sectionhead"><h2>СЎНГГИ ЯНГИЛИКЛАР</h2><button class="all" onclick="go('news')">Барчаси →</button></div>${db.news.slice().reverse().slice(0,3).map(cardNews).join('')||empty()}</section>`}
function cardNews(n){return `<article class="card"><span class="tag">${esc(n.cat)} • ${esc(n.date)}</span><h3>${esc(n.title)}</h3><p>${esc(n.text)}</p></article>`}
function content(p){let title=labels[p];if(p==='news')return section(title,db.news.slice().reverse().map(cardNews).join(''));if(p==='songs')return section(title,db.songs.slice().reverse().map(s=>`<article class="card"><div class="row"><div class="thumb" style="display:grid;place-items:center;font-size:34px">♫</div><div><h3>${esc(s.title)}</h3><p>${esc(s.artist)} • ${esc(s.date)}</p>${s.url?`<a class="pill" href="${esc(s.url)}" target="_blank">Очиш</a>`:''}</div></div></article>`).join(''));if(p==='concerts')return section(title,db.concerts.slice().reverse().map(c=>`<article class="card"><h3>🎟 ${esc(c.city)}</h3><p>${esc(c.venue)}<br>${esc(c.date)}</p><span class="pill">${esc(c.tag)}</span></article>`).join(''));if(p==='forum')return section(title,db.forum.slice().reverse().map(f=>`<article class="card"><h3>💬 ${esc(f.title)}</h3><p>${esc(f.text)}</p><span class="pill">${esc(f.author)} • ${f.replies?.length||0} жавоб</span></article>`).join(''));if(p==='members')return section(title,db.members.slice().reverse().map(m=>`<article class="card"><div class="row"><div class="thumb" style="display:grid;place-items:center;background:#8e611b;color:#170807;font-size:25px;overflow:hidden">${m.image?`<img src="${esc(m.image)}" style="width:100%;height:100%;object-fit:cover">`:esc(m.name[0]||'A')}</div><div><h3>${esc(m.name)}</h3><p>${esc(m.since)}-йилдан бери • ${esc(m.tier)}</p></div></div></article>`).join(''));if(p==='gallery')return section(title,db.gallery.slice().reverse().map(g=>`<article class="card"><img class="thumb" src="${esc(g.image)}"><h3>${esc(g.title)}</h3><p>${esc(g.date)}</p></article>`).join(''));if(p==='videos')return section(title,db.videos.slice().reverse().map(v=>`<article class="card"><h3>▶ ${esc(v.title)}</h3><p>${esc(v.text)}</p>${v.url?`<a class="pill" href="${esc(v.url)}" target="_blank">Видеони очиш</a>`:''}</article>`).join(''));if(p==='birthdays')return section(title,db.birthdays.slice().reverse().map(b=>`<article class="card"><h3>🎂 ${esc(b.name)}</h3><p>${esc(b.date)}<br>${esc(b.note)}</p></article>`).join(''));if(p==='notices')return section(title,db.notices.slice().reverse().map(n=>`<article class="card"><h3>🔔 ${esc(n.title)}</h3><p>${esc(n.text)}<br>${esc(n.date)}</p></article>`).join(''))}
function section(t,body){return `<section class="section"><button class="back" onclick="go('home')">← Бош саҳифа</button><div class="sectionhead"><h2>${t}</h2></div>${body||empty()}</section>`}function empty(){return '<div class="empty">Ҳали маълумот қўшилмаган.</div>'}
function openDrawer(){document.getElementById('drawer').classList.add('open')}function closeDrawer(e){if(!e||e.target.id==='drawer')document.getElementById('drawer').classList.remove('open')}
function go(p){page=p;if(p==='notices')markAllNoticesRead();render();scrollTo(0,0)}

function adminEdit(t){let form='';if(t==='settings')form=`<div class="form"><input id="f_title" value="${esc(db.settings.title)}" placeholder="Сайт номи"><input id="f_sub" value="${esc(db.settings.subtitle)}" placeholder="Қўшимча ном"><textarea id="f_desc">${esc(db.settings.description)}</textarea><label class="theme-label">🎨 Сайт дизайни</label><select id="f_theme"><option value="gold" ${db.settings.theme==='gold'?'selected':''}>1 — Олтин-қизил классик</option><option value="blue" ${db.settings.theme==='blue'?'selected':''}>2 — Қора-кўк замонавий</option><option value="redgold" ${db.settings.theme==='redgold'?'selected':''}>3 — Тилла фон + қизил ёзув</option><option value="green" ${db.settings.theme==='green'?'selected':''}>4 — Яшил замонавий</option><option value="black" ${db.settings.theme==='black'?'selected':''}>5 — Сиёх (қора-кумуш)</option><option value="purple" ${db.settings.theme==='purple'?'selected':''}>6 — Бинафша (#800080)</option></select><label>▣ Карточка бурчаклари</label><select id="f_radius"><option value="8" ${Number(db.settings.cardRadius)===8?'selected':''}>Кам — 8px</option><option value="16" ${Number(db.settings.cardRadius)===16?'selected':''}>Ўрта — 16px</option><option value="24" ${Number(db.settings.cardRadius)===24?'selected':''}>Кўпроқ — 24px</option></select><label>▤ Рамка қалинлиги</label><select id="f_border"><option value="1" ${Number(db.settings.borderWidth)===1?'selected':''}>1px</option><option value="2" ${Number(db.settings.borderWidth)===2?'selected':''}>2px</option><option value="3" ${Number(db.settings.borderWidth)===3?'selected':''}>3px</option><option value="4" ${Number(db.settings.borderWidth)===4?'selected':''}>4px</option></select><label>🌄 Фон услуби</label><select id="f_bg"><option value="gradient" ${db.settings.backgroundStyle==='gradient'?'selected':''}>Градиент</option><option value="solid" ${db.settings.backgroundStyle==='solid'?'selected':''}>Бир хил ранг</option><option value="pattern" ${db.settings.backgroundStyle==='pattern'?'selected':''}>Енгил нақш</option></select><label class="checkrow"><input id="f_features" type="checkbox" ${db.settings.showHomeFeatures!==false?'checked':''}> Бош саҳифада Янгиликлар / Қўшиқлар / Видеолар блокларини кўрсатиш</label><input id="f_logo" type="file" accept="image/*"><button class="btn" onclick="saveSettings()">САҚЛАШ</button></div>`;else form=formFor(t);let list=t!=='settings'?`<hr style="border-color:#321416"><div>${(db[t]||[]).map(x=>`<div class="listitem"><span>${esc(x.title||x.name||x.city||'')}</span><button class="btn red" onclick="delItem('${t}',${x.id})">ЎЧИРИШ</button></div>`).join('')}</div>`:'';showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>${t==='settings'?'Сайт созламалари':labels[t]}</h2>${form}${list}`)}
function formFor(t){if(t==='news')return form(`Сарлавҳа|title,Категория|cat,Сана|date,Матн|text`,'news');if(t==='songs')return form(`Қўшиқ номи|title,Ижрочи|artist,Сана|date,YouTube/аудио URL|url`,'songs');if(t==='concerts')return form(`Шаҳар|city,Манзил|venue,Сана|date,Тури|tag`,'concerts');if(t==='forum')return form(`Мавзу|title,Муаллиф|author,Матн|text`,'forum');if(t==='members')return `<div class="form"><input id="f_name" placeholder="Аъзо исми"><input id="f_since" placeholder="Йил"><input id="f_tier" placeholder="Даража"><label style="color:#f7d56b;font-weight:700">📷 Аъзо расми</label><input id="f_member_image" type="file" accept="image/*" style="display:none" onchange="previewMemberImage(this)"><button type="button" class="btn" style="display:block;width:100%;text-align:center;cursor:pointer;touch-action:manipulation" onclick="document.getElementById('f_member_image').click()">📷 РАСМ ТАНЛАШ</button><div id="memberImagePreview" style="display:none;text-align:center;margin:6px 0"><img id="memberImagePreviewImg" style="width:110px;height:110px;object-fit:cover;border-radius:50%;border:2px solid #d9a52d"></div><p class="small">Тугмани босиб телефон галереясидан аъзо расмини танланг.</p><input id="f_member_image_url" placeholder="ёки расм URL манзили (ихтиёрий)"><button type="button" class="btn" onclick="saveMember()">ҚЎШИШ</button></div>`;if(t==='birthdays')return form(`Исм|name,Туғилган сана|date,Изоҳ|note`,'birthdays');if(t==='notices')return form(`Сарлавҳа|title,Матн|text,Сана|date`,'notices');if(t==='videos')return form(`Видео номи|title,Изоҳ|text,Видео URL|url`,'videos');if(t==='gallery')return `<div class="form"><input id="f_title" placeholder="Расм номи"><input id="f_date" placeholder="Сана"><input id="f_image" type="file" accept="image/*"><input id="f_image_url" placeholder="ёки расм URL манзили (ихтиёрий)"><button class="btn" onclick="saveGallery()">ҚЎШИШ</button></div>`}
function form(spec,t){return `<div class="form">${spec.split(',').map(z=>{let [p,id]=z.split('|');return id==='text'?`<textarea id="f_${id}" placeholder="${p}"></textarea>`:`<input id="f_${id}" placeholder="${p}">`}).join('')}<button class="btn" onclick="saveItem('${t}')">ҚЎШИШ</button></div>`}
function val(id){return document.getElementById(id)?.value.trim()||''}
function saveSettings(){db.settings.title=val('f_title');db.settings.subtitle=val('f_sub');db.settings.description=val('f_desc');db.settings.theme=val('f_theme')||'gold';db.settings.cardRadius=Number(val('f_radius')||16);db.settings.borderWidth=Number(val('f_border')||2);db.settings.backgroundStyle=val('f_bg')||'gradient';db.settings.showHomeFeatures=!!document.getElementById('f_features')?.checked;let f=document.getElementById('f_logo').files[0];if(f){let r=new FileReader();r.onload=()=>{db.settings.logo=r.result;save();showAdmin();render()};r.readAsDataURL(f)}else{save();showAdmin();render()}}
function saveItem(t){let o={id:Date.now()};for(const k of ['title','cat','date','text','artist','url','city','venue','tag','author','name','since','tier','note']){let el=document.getElementById('f_'+k);if(el)o[k]=el.value.trim()}if(t==='forum')o.replies=[];
if(!o.title&&!o.name&&!o.city){alert('Маълумот киритинг');return}
db[t].push(o);
if(t==='notices'){
 const read=getReadNoticeIds().filter(x=>x!==String(o.id));
 localStorage.setItem(NOTICE_READ_KEY,JSON.stringify(read));
}
save();adminEdit(t)}
function saveGallery(){let f=document.getElementById('f_image')?.files?.[0];let url=val('f_image_url');if(!f&&!url){alert('Расм танланг ёки URL манзил киритинг');return}if(url){db.gallery.push({id:Date.now(),title:val('f_title'),date:val('f_date'),image:url});save();adminEdit('gallery');return}let r=new FileReader();r.onload=()=>{db.gallery.push({id:Date.now(),title:val('f_title'),date:val('f_date'),image:r.result});save();adminEdit('gallery')};r.readAsDataURL(f)}
function previewMemberImage(input){const f=input?.files?.[0];const box=document.getElementById('memberImagePreview');const img=document.getElementById('memberImagePreviewImg');if(!f||!img)return;if(!f.type.startsWith('image/')){alert('Фақат расм танланг');input.value='';if(box)box.style.display='none';return}const r=new FileReader();r.onload=()=>{img.src=r.result;if(box)box.style.display='block'};r.readAsDataURL(f)}
function compressMemberImage(file,done){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900;let w=im.width,h=im.height;if(w>max||h>max){const k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}const c=document.createElement('canvas');c.width=w;c.height=h;const ctx=c.getContext('2d');ctx.drawImage(im,0,0,w,h);done(c.toDataURL('image/jpeg',0.82))};im.onerror=()=>done(null);im.src=r.result};r.onerror=()=>done(null);r.readAsDataURL(file)}
function saveMember(){let name=val('f_name'),since=val('f_since'),tier=val('f_tier');if(!name){alert('Аъзо исмини киритинг');return}let input=document.getElementById('f_member_image');let f=input?.files?.[0];let url=val('f_member_image_url');let o={id:Date.now(),name,since,tier};if(!f&&url){o.image=url;db.members.push(o);save();adminEdit('members');return}if(!f){db.members.push(o);save();adminEdit('members');return}compressMemberImage(f,data=>{if(!data){alert('Расмни ўқиб бўлмади. Бошқа расм танланг.');return}o.image=data;db.members.push(o);save();adminEdit('members')})}
function delItem(t,id){if(confirm('Ўчирилсинми?')){db[t]=db[t].filter(x=>x.id!==id);save();adminEdit(t)}}
function showModal(x){document.getElementById('modalbox').innerHTML=x;document.getElementById('modal').classList.add('open')}function closeModal(){document.getElementById('modal').classList.remove('open')}
render();cloudLoad();
</script>

<script id="chin-member-profile-fix">
(function(){
  const URL='https://dfoeubgbwsuirhqolgwd.supabase.co';
  const KEY='sb_publishable_aw2bFgHT87xOgfPqRMBtDQ_bfnf-OxK';
  let session=null;

  function headers(token){
    return {'apikey':KEY,'Authorization':'Bearer '+(token||KEY),'Content-Type':'application/json'};
  }
  function save(s){localStorage.setItem('chin_member_session',JSON.stringify(s));session=s;}
  function load(){try{session=JSON.parse(localStorage.getItem('chin_member_session')||'null')}catch(e){session=null}}
  function clear(){localStorage.removeItem('chin_member_session');session=null;}
  function sync(){
    const a=document.getElementById('chinMemberLogin'),p=document.getElementById('chinMemberProfileBtn');
    if(a)a.style.display=session?'none':'block';
    if(p)p.style.display=session?'block':'none';
  }
  window.chinOpenLogin=function(){document.getElementById('chinLoginModal').style.display='flex';};
  window.chinCloseLogin=function(){document.getElementById('chinLoginModal').style.display='none';};
  window.chinOpenProfile=function(){
    if(!session){chinOpenLogin();return;}
    const u=session.user||session;
    const meta=u.user_metadata||{};
    document.getElementById('chinPName').textContent=meta.name||meta.full_name||'Аъзо';
    document.getElementById('chinPEmail').textContent=u.email||'—';
    document.getElementById('chinPTier').textContent='Фан-клуб аъзоси';
    document.getElementById('chinPSince').textContent=meta.since||new Date().toLocaleDateString('uz-UZ');
    const themeSel=document.getElementById('chinPTheme');
    if(themeSel) themeSel.value=localStorage.getItem('chin_member_theme')||'';
    document.getElementById('chinProfileModal').style.display='flex';
  };
  window.chinCloseProfile=function(){document.getElementById('chinProfileModal').style.display='none';};
  window.chinLogout=function(){clear();sync();chinCloseProfile();};
  window.chinApplySession=function(s){save(s);sync();};

  window.chinLogin=async function(){
    const email=document.getElementById('chinLoginEmail').value.trim();
    const password=document.getElementById('chinLoginPass').value;
    const msg=document.getElementById('chinLoginMsg');
    if(!email||!password){msg.textContent='Email ва парольни киритинг.';return;}
    msg.textContent='Кирилмоқда...';
    try{
      const r=await fetch(URL+'/auth/v1/token?grant_type=password',{
        method:'POST',headers:headers(),body:JSON.stringify({email,password})
      });
      const d=await r.json().catch(()=>({}));
      if(!r.ok) throw new Error(d.error_description||d.msg||d.message||'Email ёки пароль нотўғри.');
      save({access_token:d.access_token,refresh_token:d.refresh_token,user:d.user});
      msg.textContent='Муваффақиятли кирдингиз!';
      sync();
      setTimeout(chinCloseLogin,500);
    }catch(e){msg.textContent=e.message||'Киришда хатолик.';}
  };

  document.addEventListener('DOMContentLoaded',function(){load();sync();});
})();
</script>

<script id="chin-members-edit-and-forum-fix">
(function(){
  // ---------- 1) Аъзолар рўйхатини таҳрирлаш (edit members) ----------
  let editingMemberId = null;

  const _origShowAdmin = window.showAdmin;
  window.showAdmin = function(){ editingMemberId = null; _origShowAdmin(); };

  window.adminEdit = function(t){
    if (t !== 'members') { editingMemberId = null; return renderGenericAdmin(t); }
    renderMembersAdmin();
  };

  // re-implementation of the original generic admin editor (for non-member types)
  function renderGenericAdmin(t){

n></select><label class="checkrow"><input id="f_features" type="checkbox" ${db.settings.showHomeFeatures!==false?'checked':''}> Бош саҳифада Янгиликлар / Қўшиқлар / Видеолар блокларини кўрсатиш</label><input id="f_logo" type="file" accept="image/*"><button class="btn" onclick="saveSettings()">САҚЛАШ</button></div>`;
    } else {
      form = formFor(t);
    }
    let list = t !== 'settings' ? `<hr style="border-color:#321416"><div>${(db[t]||[]).map(x=>`<div class="listitem"><span>${esc(x.title||x.name||x.city||'')}</span><button class="btn red" onclick="delItem('${t}',${x.id})">ЎЧИРИШ</button></div>`).join('')}</div>` : '';
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>${t==='settings'?'Сайт созламалари':labels[t]}</h2>${form}${list}`);
  }

  function renderMembersAdmin(){
    const editing = editingMemberId ? (db.members||[]).find(m=>m.id===editingMemberId) : null;
    const previewShown = !!(editing && editing.image);
    const formHtml = `<div class="form">
      <input id="f_name" placeholder="Аъзо исми" value="${esc(editing?editing.name:'')}">
      <input id="f_since" placeholder="Йил" value="${esc(editing?editing.since:'')}">
      <input id="f_tier" placeholder="Даража" value="${esc(editing?editing.tier:'')}">
      <label style="color:#f7d56b;font-weight:700">📷 Аъзо расми</label>
      <input id="f_member_image" type="file" accept="image/*" style="display:none" onchange="previewMemberImage(this)">
      <button type="button" class="btn" style="display:block;width:100%;text-align:center;cursor:pointer;touch-action:manipulation" onclick="document.getElementById('f_member_image').click()">📷 РАСМ ТАНЛАШ</button>
      <div id="memberImagePreview" style="${previewShown?'':'display:none;'}text-align:center;margin:6px 0"><img id="memberImagePreviewImg" style="width:110px;height:110px;object-fit:cover;border-radius:50%;border:2px solid #d9a52d" ${previewShown?`src="${esc(editing.image)}"`:''}></div>
      <p class="small">Тугмани босиб телефон галереясидан аъзо расмини танланг.</p>
      <input id="f_member_image_url" placeholder="ёки расм URL манзили (ихтиёрий)" value="${editing && editing.image && /^https?:\/\//.test(editing.image)?esc(editing.image):''}">
      <button type="button" class="btn" onclick="saveMember()">${editing?'ЎЗГАРИШЛАРНИ САҚЛАШ':'ҚЎШИШ'}</button>
      ${editing?`<button type="button" class="btn dark" onclick="cancelMemberEdit()">БЕКОР ҚИЛИШ</button>`:''}
    </div>`;
    const listHtml = `<hr style="border-color:#321416"><div>${(db.members||[]).map(x=>`<div class="listitem"><span>${esc(x.name||'')}</span><span style="display:flex;gap:6px"><button class="btn" onclick="startMemberEdit(${x.id})">ТАҲРИР</button><button class="btn red" onclick="delItem('members',${x.id})">ЎЧИРИШ</button></span></div>`).join('')}</div>`;
    showModal(`<button class="back" onclick="showAdmin()">← Админ</button><h2>${labels.members}</h2>${formHtml}${listHtml}`);
  }

  window.startMemberEdit = function(id){ editingMemberId = id; renderMembersAdmin(); };
  window.cancelMemberEdit = function(){ editingMemberId = null; renderMembersAdmin(); };

  window.saveMember = function(){
    const name = val('f_name'), since = val('f_since'), tier = val('f_tier');
    if (!name) { alert('Аъзо исмини киритинг'); return; }
    const input = document.getElementById('f_member_image');
    const f = input && input.files && input.files[0];
    const url = val('f_member_image_url');

    function finish(imageData){
      if (editingMemberId) {
        const m = (db.members||[]).find(x=>x.id===editingMemberId);
        if (m) {
          m.name = name; m.since = since; m.tier = tier;
          if (imageData) m.image = imageData; else if (url) m.image = url;
        }
        editingMemberId = null;
      } else {
        const o = { id: Date.now(), name, since, tier };
        if (imageData) o.image = imageData; else if (url) o.image = url;
        db.members.push(o);
      }
      save();
      renderMembersAdmin();
    }
    if (f) {
      compressMemberImage(f, data=>{
        if (!data) { alert('Расмни ўқиб бўлмади. Бошқа расм танланг.'); return; }
        finish(data);
      });
    } else {
      finish(null);
    }
  };

  window.delItem = function(t, id){
    if (!confirm('Ўчирилсинми?')) return;
    db[t] = (db[t]||[]).filter(x=>x.id!==id);
    if (t === 'members' && editingMemberId === id) editingMemberId = null;
    save();
    adminEdit(t);
  };

  // ---------- 2) Форумни ишлайдиган қилиш (working public forum) ----------
  function forumAuthorName(){
    try{
      const s = JSON.parse(localStorage.getItem('chin_member_session')||'null');
      const u = s && (s.user||s);
      const meta = (u && u.user_metadata) || {};
      return meta.name || meta.full_name || '';
    }catch(e){ return ''; }
  }

  function forumTopicCard(f){
    const replies = f.replies || [];
    const nm = forumAuthorName();
    return `<article class="card">
      <h3>💬 ${esc(f.title)}</h3>
      <p>${esc(f.text)}</p>
      <span class="pill">${esc(f.author)} • ${replies.length} жавоб</span>
      ${replies.length?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid #3a1a1a">${replies.map(r=>`<p style="margin:6px 0;font-size:13px"><b style="color:#f7d56b">${esc(r.author)}:</b> ${esc(r.text)}</p>`).join('')}</div>`:''}
      <button type="button" class="btn" style="margin-top:10px" onclick="toggleReplyForm(${f.id})">💬 Жавоб ёзиш</button>
      <div id="replyForm-${f.id}" class="form" style="display:none;margin-top:10px">
        ${nm?'':`<input id="replyAuthor-${f.id}" placeholder="Исмингиз">`}
        <textarea id="replyText-${f.id}" placeholder="Жавобингизни ёзинг..."></textarea>
        <button type="button" class="btn" onclick="submitForumReply(${f.id})">Юбориш</button>
      </div>
    </article>`;
  }

  function forumSection(){
    const nm = forumAuthorName();
    const formHtml = `<div class="form" style="margin-bottom:14px">
      <h3 style="margin:0;color:#f7d56b">✍ Янги мавзу очиш</h3>
      ${nm?'':'<input id="newForumAuthor" placeholder="Исмингиз">'}
      <input id="newForumTitle" placeholder="Мавзу сарлавҳаси">
      <textarea id="newForumText" placeholder="Фикрингизни ёзинг..."></textarea>
      <button type="button" class="btn" onclick="submitNewForumTopic()">МАВЗУ ҚЎШИШ</button>
    </div>`;
    const topics = (db.forum||[]).slice().reverse().map(forumTopicCard).join('');
    return section(labels.forum, formHtml + (topics || empty()));
  }

  const _origContent = window.content;
  window.content = function(p){
    if (p === 'forum') return forumSection();
    return _origContent(p);
  };

  window.toggleReplyForm = function(id){
    const el = document.getElementById('replyForm-'+id);
    if (!el) return;
    el.style.display = (el.style.display === 'none' || !el.style.display) ? 'block' : 'none';
  };

  window.submitNewForumTopic = function(){
    const title = (document.getElementById('newForumTitle')?.value||'').trim();
    const text = (document.getElementById('newForumText')?.value||'').trim();
    const authorInput = document.getElementById('newForumAuthor');
    const author = forumAuthorName() || (authorInput?authorInput.value.trim():'') || 'Мехмон';
    if (!title || !text) { alert('Мавзу сарлавҳаси ва матнини киритинг'); return; }
    db.forum.push({ id: Date.now(), title, author, text, replies: [] });
    save();
    go('forum');
  };

  window.submitForumReply = function(id){
    const textEl = document.getElementById('replyText-'+id);
    const authorEl = document.getElementById('replyAuthor-'+id);
    const text = (textEl?.value||'').trim();
    const author = forumAuthorName() || (authorEl?authorEl.value.trim():'') || 'Мехмон';
    if (!text) { alert('Жавоб матнини киритинг'); return; }
    const topic = (db.forum||[]).find(f=>f.id===id);
    if (!topic) return;
    if (!topic.replies) topic.replies = [];
    topic.replies.push({ id: Date.now(), author, text });
    save();
    go('forum');
  };
})();
</script>

<script id="chin-birthday-photo-and-gallery-video-fix">
(function(){
  const _prevAdminEdit = window.adminEdit;

  window.adminEdit = function(t){
    if (t === 'birthdays') return renderBirthdaysAdmin();
    if (t === 'gallery') return renderGalleryAdmin();

  window.content = function(p){

  // ---------- Туғилган кунлар: телефондан расм қўшиш ----------

      save();
      renderBirthdaysAdmin();
    }
    if (f) {
      compressMemberImage(f, data=>{
        if (!data) { alert('Расмни ўқиб бўлмади. Бошқа расм танланг.'); return; }
        finish(data);
      });

      finish(null);

  function birthdaysSection(){

  // ---------- Фанклуб ижодидан: видео URL қўшиш ----------

  window.saveGallery = function(){

  function gallerySection(){
